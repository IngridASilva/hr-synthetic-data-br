name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite disparo manual pela aba Actions, útil para regerar a base.
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes de invariantes
        run: pytest tests -q

  gerar-base:
    # Só roda depois que os testes passam, e só na main.
    needs: qualidade
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Gerar base sintética
        run: hrsynth --config config/params.yaml

      - name: Publicar base como artefato
        uses: actions/upload-artifact@v4
        with:
          name: base-sintetica-rh
          path: data/synthetic/
          retention-days: 30
